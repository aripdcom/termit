name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\([^"]*\)"/\1/p' termit/__init__.py)
          pyproject=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml)
          echo "tag=$tag  __init__.py=$version  pyproject.toml=$pyproject"
          if [ "$tag" != "$version" ] || [ "$tag" != "$pyproject" ]; then
            echo "::error::Tag v$tag does not match the version in the sources. Run: make bump VERSION=$tag"
            exit 1
          fi
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          echo "Release notes:"; cat notes.md
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Termit $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Termit $GITHUB_REF_NAME" --notes-file notes.md
          fi
